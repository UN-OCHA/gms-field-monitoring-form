name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare versioned site
        run: |
          mkdir -p _site
          tar --exclude=.git --exclude=.github --exclude=_site -cf - . | tar -xf - -C _site
          version="${GITHUB_SHA::12}"
          sed -i "s/__DEPLOY_VERSION__/${version}/g" _site/sw.js
          printf '{"version":"%s","commit":"%s","deployedAt":"%s"}\n' \
            "$version" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
